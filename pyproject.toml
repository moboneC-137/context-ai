[project]
name = "contextai"
version = "0.1.0"
description = "ContextAI application layer: invocation, capture policy, actions, providers, panel and evals on top of the Swift capture-spike."
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextai"]

[tool.pytest.ini_options]
testpaths = ["pytests"]  # "tests" would collide with SwiftPM's Tests/ on a case-insensitive filesystem
addopts = "-q"
pythonpath = ["."]  # makes the top-level evals/ package importable in tests

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".build", "Sources", "Tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors + import order: the set the code was written against. Stricter rule
# families (UP, B, RUF, PL) report ~40 findings on the current code and are a separate change.
select = ["E4", "E7", "E9", "F", "I"]
